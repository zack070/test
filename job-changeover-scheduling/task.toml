relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving resource-constrained scheduling, throughput planning, and reconciliation of production outcomes against operational targets. This gives me a working sense of what a genuine production-scheduling operation actually has to weigh (changeover costs against due-date pressure, priority-weighted lateness, the real cost of a naive first-come-first-served or earliest-due-date ordering) and what a realistic versus contrived version of that tradeoff looks like, including what kind of approach a competent-but-not-expert engineer plausibly reaches for (a known dispatch rule, or a call to an off-the-shelf solver) versus what genuine scheduling expertise requires. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance, which is directly relevant to judging whether this task's grading (a sealed pass bar calibrated directly against a measured exact-solver run and a measured published heuristic, both run at the same time budget the agent's own submission receives) is a fair and meaningful test rather than an arbitrary one. I am not an operations-research specialist by training; the technical implementation (the scheduling model and its parameters, the ATCS-plus-metaheuristic reference solution, the calibration of the pass bar against measured exact-solver and heuristic baselines on independently-generated instances, and the two-stage sealed verifier) was built with AI assistance under my direction, with my own judgment applied to whether the model, the baselines, and the grading reflect a realistic production-scheduling tradeoff and a realistic test of solving it well.
"""

