[task]
name = "afterquery/field-service-dispatch"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by field-service and workforce-dispatch planners at operations that send technicians to skill-matched jobs against SLA deadlines -- HVAC/electrical/plumbing service companies, telecom and utility field service, and similar dispatch-heavy operations. Two properties of the shift make this a genuine assignment problem rather than a stream of independent per-job choices. First, jobs that arrive at the same moment are still revealed to the policy one at a time (confirmed directly against the simulator's own event queue), so a policy that commits to each job the instant it individually becomes visible never actually sees what else arrives seconds later at the same timestamp -- it has to recognize that the pending set may still be filling in and hold off committing a technician until it has. Second, once that batch is actually assembled, several technician/job combinations in every shift are a genuine weighted-bipartite-matching case: two technicians whose overtime headroom is split differently even though their totals are similar, and two jobs of different duration, where the technician who looks cheapest for whichever job you consider first is provably not part of the globally cheapest pairing once you account for what the other job would then cost. We measured both effects directly rather than assuming them, separately on two held-out shifts that also differ in technician-pool size, skill-scarcity ratio, and arrival cadence, so a policy tuned to one shift's shape can't coast on the other. 51 probes were run against each shift: 13 fixed-priority families (four job-ordering rules crossed with four tie-break rules, with and without a feasibility filter, plus a kitchen-sink pass and a policy that greedily takes the single cheapest real-cost pairing at each step) and 16 more that additionally wait for the arrival batch to stabilize before applying the same fixed-priority logic -- specifically to isolate whether recognizing the need to wait, by itself, is enough. None of the 51 gets below 782.0 on the first shift or 785.0 on the second; the batch-aware ones do consistently better than their non-waiting twins but still fall well short, because waiting only produces a bigger batch to get right, it doesn't by itself get it right. A policy that both waits for the batch and solves it as an exact minimum-cost matching reaches 527.0 on the first shift and 267.5 on the second, and a second, independently-built implementation (a different exact algorithm and a differently-shaped scarcity term) converges on the identical value on both. All scenario data (technicians, skills, jobs, arrival times), across every visible sample and both held-out shifts, is synthetically generated for this task and does not represent any real company's operations.
"""

solution_explanation = """
The reference solution tracks, at time zero only, whether the set of pending jobs is still growing from one decide() call to the next; as long as it is, the policy returns no assignments, and the moment it holds steady the policy treats every job that arrived at time zero as one batch. From then on, and at every later decision point, it builds the full cost matrix of every currently free technician against every currently pending job (overtime incurred, fatigue-inflated duration, whether the pairing actually avoids that job's own deadline breach, and whether the technician's other skills are scarce enough to be worth reserving, all folded into one per-pairing cost) and solves the resulting minimum-cost bipartite matching exactly with the Hungarian algorithm, padded with zero-cost "leave idle" / "leave unserved" options so that not every technician or job must be matched. An earlier version of this reference neither waited for the time-zero batch nor handled its own scarcity term correctly (a technician with no other skill to protect was scored as merely neutral rather than as the safest possible choice, which is backwards -- a pure generalist should always be preferred over a specialist for work either could do), and a brute-force search with a fixed batch cap could silently drop a job from consideration under backlog; together these let a plain feasibility-aware greedy match or beat the "exact" search on some instances, which was a real correctness bug, not a difficulty feature, and is why the current formulation is deliberately uncapped and was re-derived and re-verified from scratch. A second, independently-built implementation (a different exact algorithm -- min-cost flow via successive shortest augmenting paths -- with a differently-shaped scarcity term, and the same time-zero batching) was used to cross-check the floor on both held-out shifts: it converges on the identical 527.0 and 267.5 floors respectively. Both pass bars are set with real margin above that floor (600.0 against 527.0, and 400.0 against 267.5) and a larger margin below the best of 51 tested greedy/heuristic probes (782.0 and 785.0), so legitimate implementation variance is tolerated without the bar becoming reachable by any tested heuristic.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 200-second combined wall-clock budget, UID-swept after running) imports the candidate's submitted policy module FRESH for each of the two sealed held-out shifts -- a fresh import matters because the instruction invites the candidate to keep internal bookkeeping across decide() calls, and reusing one imported module across both shifts would let shift-1 module state leak into shift-2's grading run -- and runs it via the real simulator. The only thing Stage 1 hands off to Stage 2 is the raw sequence of (technician_id, job_id) pairs the policy's decide() function returned at each call on each shift (the "decision trace" per shift), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) mechanically replays each shift's exact sequence through the same deterministic event loop used to build that sealed scenario, independently re-validating every claimed assignment from scratch (technician actually free, job actually pending, skill match, finish time within the technician's overtime cap) and recomputing total cost from first principles. A fabricated or inconsistent trace can only replay to an equal or worse score than a faithful one, never better, since replay strictly re-derives validity rather than trusting the trace's implied legality. The candidate must clear each shift's own calibrated pass bar individually (600.0 on held_out_1, 400.0 on held_out_2) -- not an average across the two -- so a policy tuned to only one shift's structure cannot pass by coasting on the other.
"""

category = "Operations"
subcategory = "Logistics"
tags = ["dispatch", "scheduling", "simulation", "workforce-management", "logistics", "discrete-event"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving logistics, dispatch, and resource allocation -- assessing routing, resource allocation, inventory levels, production constraints, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real operational constraints. This gives me a working sense of what a genuine field-service/workforce dispatch operation actually has to balance (technician availability, skill coverage, deadline pressure, overtime cost) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (a held-out simulation replay against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization or simulation engineer and have not previously built discrete-event simulators; the technical implementation (the simulator, the trace-replay verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the scheduling rules and grading reflect a realistic dispatch operation.
"""

