[task]
name = "afterquery/field-service-dispatch"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by field-service and workforce-dispatch planners at operations that send technicians to skill-matched jobs against SLA deadlines -- HVAC/electrical/plumbing service companies, telecom and utility field service, and similar dispatch-heavy operations. Jobs and technician availability arrive in irregular batches through the shift: at many decision points several pending jobs and several free technicians are on the table simultaneously, with overlapping (not one-to-one) skill eligibility. Assigning them one job at a time in a fixed priority order -- by deadline, by urgency, by any tie-break rule -- is a greedy algorithm for a weighted bipartite matching problem, and greedy matching is not guaranteed to find the minimum-cost matching; a locally reasonable pick for one job can foreclose a cheaper combination across the batch as a whole. We measured this directly rather than assuming it, separately on each of two held-out shifts that differ in technician-pool size, skill-scarcity ratio, and arrival cadence, because a policy tuned against one shift's shape must not be able to coast on the other. Thirteen fixed-priority probes were built (three job-ordering rules -- earliest-deadline, urgent-first, scarcest-required-skill-first -- crossed with four tie-break rules covering every mechanism the simulator exposes, plus one policy stacking every tie-break trick into a single pass): on the first held-out shift all thirteen land at 1419.5 or worse, and on the second at 1013.5 or worse -- stacking more heuristics onto a one-job-at-a-time greedy loop does not help on either shift. A policy that recognizes the decision as a joint assignment problem and solves it exactly for each batch (an exact minimum-cost bipartite matching over every currently free technician and pending job, computed fresh at each decision point) reaches 1349.0 / 609.0 respectively without any scarcity reasoning. Adding scarce-skill reservation to that same search reaches 1272.5 on the first shift and 609.0 (unchanged) on the second: the two held-out shifts were deliberately built to differ, and they do -- one rewards scarce-skill reservation only modestly, the other not at all beyond recognizing the joint-assignment structure, so the primary and most robust difficulty driver here is genuinely solving the batch as an assignment problem under real cost accounting, not any one fixed weighting of scarcity. All scenario data (technicians, skills, jobs, arrival times), across every visible sample and both held-out shifts, is synthetically generated for this task and does not represent any real company's operations.
"""

solution_explanation = """
The reference solution treats each decision point as a genuine assignment problem rather than a sequence of independent per-job choices: at every call it builds the full cost matrix of every currently free technician against every currently pending job (overtime incurred, fatigue-inflated duration, whether the pairing actually avoids that job's own deadline breach, and whether the technician's other skills are scarce enough to be worth reserving, all folded into one per-pairing cost) and solves the resulting minimum-cost bipartite matching exactly with the Hungarian algorithm, padded with zero-cost "leave idle" / "leave unserved" options so that not every technician or job must be matched. This replaced an earlier brute-force-with-a-fixed-batch-cap version of the same idea: under real backlog the fixed cap could silently drop a job from consideration and let a fixed-priority greedy policy occasionally outscore the "exact" search on that job, which was a real correctness bug rather than a difficulty feature. The Hungarian formulation has no such cap. A second, independently-built implementation (a different exact algorithm -- min-cost flow via successive shortest augmenting paths -- with a differently-shaped scarcity term) was used to cross-check the floor on both held-out shifts: it converges on the identical 609.0 floor on the second shift, and on the first shift it lands at 1531.0, meaningfully worse than even the no-scarcity search -- concrete evidence that a scarcity bonus with a miscalibrated weight can actively hurt rather than help, and that this shift's specific scarcity margin is too narrow and formula-sensitive to gate pass/fail on safely. Both pass bars are therefore set to require genuinely solving the batch as a joint assignment problem under real cost accounting (1350.0 against a 1272.5 floor and a 1419.5 best-greedy ceiling on the first shift; 750.0 against a 609.0 floor and a 1013.5 best-greedy ceiling on the second), each individually, without additionally requiring the fragile scarcity-optimal value.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 200-second combined wall-clock budget, UID-swept after running) imports the candidate's submitted policy module once and runs it, via the real simulator, against BOTH sealed held-out shifts -- but the only thing it hands off to Stage 2 is the raw sequence of (technician_id, job_id) pairs the policy's decide() function returned at each call on each shift (the "decision trace" per shift), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) mechanically replays each shift's exact sequence through the same deterministic event loop used to build that sealed scenario, independently re-validating every claimed assignment from scratch (technician actually free, job actually pending, skill match, finish time within the technician's overtime cap) and recomputing total cost from first principles. A fabricated or inconsistent trace can only replay to an equal or worse score than a faithful one, never better, since replay strictly re-derives validity rather than trusting the trace's implied legality. The candidate must clear each shift's own calibrated pass bar individually (1350.0 on held_out_1, 750.0 on held_out_2) -- not an average across the two -- so a policy tuned to only one shift's structure cannot pass by coasting on the other.
"""

category = "Operations"
subcategory = "Logistics"
tags = ["dispatch", "scheduling", "simulation", "workforce-management", "logistics", "discrete-event"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving logistics, dispatch, and resource allocation -- assessing routing, resource allocation, inventory levels, production constraints, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real operational constraints. This gives me a working sense of what a genuine field-service/workforce dispatch operation actually has to balance (technician availability, skill coverage, deadline pressure, overtime cost) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (a held-out simulation replay against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization or simulation engineer and have not previously built discrete-event simulators; the technical implementation (the simulator, the trace-replay verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the scheduling rules and grading reflect a realistic dispatch operation.
"""

