[task]
name = "afterquery/field-service-dispatch"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by field-service and workforce-dispatch planners at operations that send technicians to skill-matched jobs against SLA deadlines -- HVAC/electrical/plumbing service companies, telecom and utility field service, and similar dispatch-heavy operations. Jobs and technician availability arrive in irregular batches through the shift: at many decision points several pending jobs and several free technicians are on the table simultaneously, with overlapping (not one-to-one) skill eligibility. Assigning them one job at a time in a fixed priority order -- by deadline, by urgency, by any tie-break rule -- is a greedy algorithm for a weighted bipartite matching problem, and greedy matching is not guaranteed to find the minimum-cost matching; a locally reasonable pick for one job can foreclose a cheaper combination across the batch as a whole. We measured this directly rather than assuming it: twelve fixed-priority probes were built, crossing three job-ordering rules (earliest-deadline, urgent-first, scarcest-required-skill-first) with tie-break rules covering every mechanism the simulator exposes (fatigue-avoidance, fewest-total-skills, most/least remaining overtime capacity, feasibility-filtered best-fit), plus one policy stacking every one of those tie-break tricks into a single pass. All twelve land at exactly 1702.0 or worse on the held-out scenario, and the kitchen-sink combination does no better than the best individual rule -- stacking more heuristics onto a one-job-at-a-time greedy loop does not help. A policy that recognizes the decision as a joint assignment problem and solves it exactly for each batch (brute-force search over which technician serves which job, feasible within the 120-second grading budget because batches are naturally small) reaches 1335.0 without any scarcity reasoning, and reaches 1090.0 once scarce-skill reservation is folded into the same search -- two independently-built implementations of that combination converge on the identical 1090.0 floor, confirming it as a real property of the problem rather than an artifact of one specific formula. All scenario data (technicians, skills, jobs, arrival times) is synthetically generated for this task and does not represent any real company's operations.
"""

solution_explanation = """
The reference solution treats each decision point as a genuine assignment problem rather than a sequence of independent per-job choices: it selects the batch of pending jobs to consider (capped at a size that keeps exhaustive search fast), then brute-force searches over which subset of those jobs to serve and which technician serves each, scoring every candidate pairing by its real consequences (overtime incurred, fatigue-inflated duration, whether the pairing actually avoids that job's own deadline breach, and whether the technician's other skills are scarce enough to be worth reserving) and picking the assignment that jointly maximizes jobs served and minimizes that cost -- rather than fixing a job or technician's fate by inspecting it in isolation. A second, independently-built implementation using a plainer cost function (no explicit breach-avoidance shaping) but the same exact-search-plus-scarcity-reservation structure reached the identical measured cost, which is the calibration evidence that the pass bar reflects a general capability (joint reasoning over the batch, combined with scarce-skill awareness within it) rather than one specific implementation's quirks. The pass bar (1200.0) was set between two directly measured points on the held-out scenario: the same exact-search approach WITHOUT scarcity reasoning (1335.0) and WITH it (1090.0, matched by both independent implementations) -- placing the bar so that recognizing the assignment-problem structure alone is not sufficient, while leaving a 110.0-point margin above the floor for legitimate implementation variance.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 120-second wall-clock budget for the full run, UID-swept after running) imports the candidate's submitted policy module and runs it, via the real simulator, against the sealed held-out scenario -- but the only thing it hands off to Stage 2 is the raw sequence of (technician_id, job_id) pairs the policy's decide() function returned at each call (the "decision trace"), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) mechanically replays that exact sequence through the same deterministic event loop used to build the sealed scenario, independently re-validating every claimed assignment from scratch (technician actually free, job actually pending, skill match, finish time within the technician's overtime cap) and recomputing total cost from first principles. A fabricated or inconsistent trace can only replay to an equal or worse score than a faithful one, never better, since replay strictly re-derives validity rather than trusting the trace's implied legality. The pass bar (1200.0) is compared against this independently replayed cost.
"""

category = "Operations"
subcategory = "Logistics"
tags = ["dispatch", "scheduling", "simulation", "workforce-management", "logistics", "discrete-event"]
expert_time_estimate_hours = 5
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving logistics, dispatch, and resource allocation -- assessing routing, resource allocation, inventory levels, production constraints, and operational priorities using structured data analysis, and applying rule-based reasoning to determine correct outcomes under real operational constraints. This gives me a working sense of what a genuine field-service/workforce dispatch operation actually has to balance (technician availability, skill coverage, deadline pressure, overtime cost) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (a held-out simulation replay against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization or simulation engineer and have not previously built discrete-event simulators; the technical implementation (the simulator, the trace-replay verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the scheduling rules and grading reflect a realistic dispatch operation.
"""

