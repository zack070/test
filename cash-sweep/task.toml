I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving resource allocation, cost tradeoffs, and operational priorities under constraints -- assessing routing, inventory, staffing, and funding decisions using structured data analysis, and applying rule-based reasoning to determine correct outcomes. This gives me a working sense of what a genuine treasury/cash-management operation actually has to balance (funding obligations on time, FX conversion cost, which balances are available when) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance across operational scenarios, which is directly relevant to judging whether this task's grading (a held-out simulation replay against a calibrated cost bar) is a fair and meaningful test rather than an arbitrary one. I am not an optimization or simulation engineer and have not previously built discrete-event simulators; the technical implementation (the simulator, the trace-replay verifier, and the calibration of the pass bar against measured baseline and reference policy performance) was built with AI assistance under my direction, with my own judgment applied to whether the funding rules and grading reflect a realistic treasury operation.
"""

