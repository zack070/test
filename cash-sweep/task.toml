[task]
name = "afterquery/cash-sweep"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This work is performed by intraday cash/treasury desks that fund same-day obligations across multiple currencies by sweeping surplus balances through FX conversions before each currency pair's daily cutoff, after which only a worse rate is available. Two properties of the day make this a genuine joint-allocation problem rather than a stream of independent per-obligation choices. First, using a currency pair's cheap rate requires initiating the transfer at or before that pair's own cutoff time, and different pairs have different cutoffs -- so the latest defensible moment to fund a given obligation is the last cutoff (across every pair that could fund it) still strictly before that obligation's own due time, not simply "as soon as possible" or "as late as possible." Second, once several obligations and funding-eligible balances are on the table at once, some of them are a genuine weighted-bipartite-matching case: two source currencies whose cheapest destination is the same obligation, where the source that looks cheapest for whichever obligation you consider first is provably not part of the globally cheapest pairing once you account for what the other obligation would then cost from whatever source is left. We measured both effects directly rather than assuming them. A gadget search drew random rate matrices and due/cutoff/arrival timings, kept only cases where the true joint-optimal cost was both strictly and robustly (>=1.3x) cheaper than every one of 21 tested non-joint strategies (immediate greedy, a cutoff-blind joint match that never waits, and patient/deferred variants at 10 different fixed wait thresholds each, including one that waits until each obligation's own due time) -- 39 such cases survived out of the random search, with due-cutoff gaps drawn continuously (not from the same fixed set of thresholds the probes use) specifically so no single fixed "wait N ticks" heuristic could happen to coincide with the right answer by construction. These gadgets were then embedded, several per scenario on disjoint currency quartets, into full scenarios that also include realistic single-route filler obligations and (on some scenarios) a mid-day credit. On the two held-out scenarios actually used for grading, a battery of roughly 30 probes (the same families above, crossed with several obligation orderings and tie-break rules) never got below 320.8 on the first scenario or 352.6 on the second; a policy that correctly identifies each obligation's own last-good-cutoff and solves the resulting joint match reaches 175.6 and 172.2 respectively. All scenario data (currencies, rates, cutoffs, obligations, credits), across every visible sample and both held-out scenarios, is synthetically generated for this task and does not represent any real institution's cash positions or FX pricing.
"""

solution_explanation = """
The reference policy computes, for every currently pending and still-underfunded obligation, the latest cutoff (across every currency pair that could fund that obligation's currency) that still falls strictly before the obligation's own due time -- using only the public rate/cutoff schedule resent on every decide() call, never anything read from disk. An obligation is "ready" once the current time has reached that trigger point (or immediately, if no cutoff exists before its due time at all). Every ready obligation is then funded jointly, not one at a time: a minimum-cost bipartite match (sources = every currency with a positive balance, sinks = the ready obligations, cost = that pair's currently-applicable rate) is solved exactly with the Hungarian algorithm, padded with a "leave this obligation unfunded this call" dummy option per obligation so the match is never forced into a worse-than-missing choice. Building this reference surfaced two real bugs, both fixed and re-verified rather than left as approximations: an early version's "leave unfunded" dummy column was detected by comparing the assigned cost to the miss penalty's numeric value, which misclassified a real, feasible transfer that happened to cost exactly that value by coincidence (a round obligation amount times a round rate); and a version without a dedicated dummy column per obligation could be forced into a real-but-terrible pairing whenever the number of ready obligations exactly equaled the number of funding sources, since no "miss it instead" option existed in that case at all. With both fixed, the reference was checked against all 39 verified gadget instances individually (reaching the analytically-computed true optimum exactly, zero misses, on all 39) before ever being embedded into a full scenario, and separately against the full ~30-probe battery on all 5 generated scenarios (3 visible-sample profiles, both held-out profiles), where it beat every probe by a measured 1.66x-9.29x margin depending on scenario and probe. Both held-out pass bars are set at 1.2x the reference's own measured cost on that scenario (210.7 against a reference cost of 175.6, and 206.6 against 172.2) -- enough slack that a genuinely near-optimal but not pixel-perfect implementation can still pass, while remaining far below the cheapest of the ~30 tested probes on either scenario (320.8 and 352.6), so no heuristic in the battery can clear the bar by accident.
"""

verification_explanation = """
The verifier never executes the candidate's code in the trusted stage and never trusts anything the untrusted stage computes. Stage 1 (unprivileged, 200-second combined wall-clock budget, UID-swept after running) runs the candidate's decide() in a genuinely separate OS process, spawned fresh (never forked) for each of the two sealed held-out scenarios and communicating with the real simulator only through JSON-encoded SimState data over queues -- current_time, balances, pending obligations, and the public rate/cutoff schedule, exactly the documented snapshot and nothing else. A fresh process per scenario matters on its own terms: the instruction invites the candidate to keep internal bookkeeping across decide() calls, and reusing one process across both scenarios would let one scenario's state leak into the other's grading run. The only thing Stage 1 hands off to Stage 2 is the raw sequence of (from_currency, to_currency, amount) triples decide() returned at each call on each scenario (the "decision trace"), not a computed score. Stage 2 (trusted, root, executes no candidate code at all) mechanically replays each scenario's exact sequence through the same deterministic event loop used to build that sealed scenario, independently re-validating every transfer from scratch (sufficient balance at that point in the batch, a real market for the pair, current-vs-cutoff rate applied correctly) and recomputing total cost from first principles. A fabricated or inconsistent trace can only replay to an equal or worse score than a faithful one, never better.

This bundle's verifier architecture is reused from a companion field-service-dispatch bundle, but every lesson that bundle's own adversarial testing surfaced was applied from the start here rather than discovered late. That companion bundle's process isolation (closing a stack-introspection leak of hidden future state) initially left a second, more direct channel open: the candidate's worker process runs under the same unprivileged UID as the trusted orchestrator that reads the raw scenario files, so process isolation alone -- which only stops shared memory, not shared filesystem access -- did not stop it from simply open()-ing the same sealed files directly. Two things address this here from day one. First, the rate/cutoff schedule -- the part of the scenario that is genuinely public, static market data -- is baked directly into every SimState payload sent over the queue, so there is no separate file holding it for a same-UID process to reach for in the first place. Second, the obligation schedule -- the part that, like a job's arrival in the companion bundle, must stay hidden until the simulator's own event loop reveals each one -- is still a file on disk that Stage 1 genuinely needs to read once to drive the simulation, so it is sealed the same way the companion bundle's fix ended up working: `test.sh` chown's `/tests/sealed/inputs` to the unprivileged user before Stage 1 runs (chmod only takes effect for a file's owner or root, so this ownership transfer has to happen first), and `collect_agent_output.py` reads every scenario's raw data into memory and chmod 000's every scenario file and directory for BOTH held-out scenarios before spawning even the first candidate worker process -- so no candidate code, on either scenario, is ever running while that data is still readable by a non-root user. Stage 2 (root) is unaffected, since root bypasses permission bits and needs this same data again later to independently recompute ground truth for replay. Both this direct-file-read exploit and a stack-introspection reproduction (which finds nothing, since decide() never runs in the same process as the trusted simulator to begin with) were tested against this bundle's own verifier and measured reward 0, alongside five other standard adversarial patterns (early exit, a crashing policy, a malformed interface, a forked reward-forgery daemon, and a direct read of the sealed pass-bar file) -- see cheat/README.md for the measured result of each. The candidate must clear each scenario's own calibrated pass bar individually (210.7 on held_out_1, 206.6 on held_out_2) -- not an average across the two -- so a policy tuned to only one scenario's structure cannot pass by coasting on the other.
"""

