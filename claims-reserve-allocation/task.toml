[task]
name = "afterquery/claims-reserve-allocation"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
Claims/reserving analysts and actuaries who manage a live book of open claims spend real budget cycles deciding which claims to settle now (at a negotiated discount) versus defer, under a hard cash cap, knowing that deferred claims carry real, correlated risk, and that some claims only settle favorably as part of a negotiated package with a specific other claim (co-defendant claims, or a single claimant's related claims). This task reproduces that decision using a synthetic but fully disclosed generative model (severity distributions by claim type, a shared per-incident-cluster correlation factor, litigation escalation, interest accrual, and linked-claim-pair package discounts -- see MODEL_SPEC.md) and synthetic claim/portfolio data generated for this task, not real filings. The agent must submit a policy (code, run once per portfolio) choosing settle-now vs. defer per claim, minimizing E[total_cost] + risk_lambda * CVaR_95(total_cost) subject to a hard budget cap. Even with the full model disclosed, there is no closed-form or simple lookup answer, and -- this was checked directly, not assumed -- correlation-awareness alone is not sufficient: a genuinely sophisticated pair-blind heuristic (build a Monte Carlo simulator from the disclosed model, greedily settle whichever claim gives the best simulated marginal objective improvement per dollar recomputed each round, then polish with 1-1 swaps -- a real, non-strawman approach requiring real understanding of the model) reliably fails both sealed bars by 3.4%-4.1%, because it never discovers that a linked pair's two claims are individually a bad deal but jointly a good one -- no per-claim marginal-value search can, since neither half shows standalone improvement. Finding them requires genuine joint/combinatorial reasoning (the reference solution's AND-linearized MILP: w_pair = x_i AND x_j). Both an exact expected-value-optimal knapsack (correlation- and pair-blind) and that pair-blind marginal-value heuristic were measured directly against the real verifier and both fail both sealed bars with large, reproducible margins (7.7%-9.8% and 3.4%-4.1% respectively); the pass bar is calibrated to sit strictly below whichever of the two a submission could otherwise coast on.
"""

solution_explanation = """
The reference solution (solution/policy.py) is a scenario-based mixed-integer program: it Monte Carlo-samples the disclosed model to build a scenario matrix of each claim's deferred cost under 2,000 draws (respecting the shared per-cluster correlation factor), then solves a MILP (via scipy.optimize.milp / HiGHS) that jointly picks settle/defer decisions, a Rockafellar-Uryasev linearization of CVaR_95, and an AND-linearization per linked-claim pair (an auxiliary binary w_p with w_p <= x_i, w_p <= x_j, w_p >= x_i + x_j - 1, so the pair's discount is only realized in the objective and budget constraints when both members are jointly settled) -- minimizing the exact disclosed objective subject to the budget cap. This measurably outperforms both the exact expected-value-optimal knapsack and a genuinely strong pair-blind greedy-plus-swap heuristic (dev/greedy_swap_solver.py, built specifically to replicate a heuristic that passed an earlier, less complete version of this bundle's bars) on both sealed portfolios, confirmed with fresh random seeds independent of the ones used during calibration.
"""

verification_explanation = """
The agent's deliverable is /app/outputs/policy.py -- executable code, run once per sealed held-out portfolio as a fresh subprocess under the unprivileged runner user with a firm per-portfolio timeout, the same one-shot-batch isolation pattern used on the companion withholding-tax bundle (no live decide()-per-event loop, so no incrementally-revealed state and no frame-introspection surface). What must stay hidden is the exact Monte Carlo draws used to compute the graded objective and the numeric pass bar itself; both live in tests/sealed/reference/, chown+chmod sealed to root before Stage 1 (untrusted) ever runs. The sealed INPUT portfolio data is deliberately left readable, since the candidate's code legitimately needs it -- the model itself is fully disclosed on purpose; only the specific grading realization is secret. Stage 2 (trusted, root, executes no candidate code) independently re-simulates the submitted decision set against the sealed seed and checks the budget constraint mechanically (a deterministic dollar-sum comparison, not subject to simulation noise) before ever running a simulation. Eleven adversarial submissions were tested against the real verifier (see cheat/README.md for each one's measured result): reward forgery, a sealed-reference read attempt, a crash, a malformed interface, an infinite loop, a budget-cap violation, settling nothing, a naive fixed-order greedy, an exact expected-value-optimal-but-risk-and-pair-blind knapsack (shortfall 7.7%-9.8%), a genuinely sophisticated pair-blind greedy-by-simulated-marginal-value-plus-1-1-swaps heuristic (the specific class of submission that passed an earlier, less complete version of this bundle's bars -- shortfall 3.4%-4.1%, confirmed to settle zero linked-pair claims on either dataset), and a memorized-visible-answers lookup embedded in the single graded file (fails a deterministic budget-cap check, since the visible dataset's budget doesn't match either sealed portfolio's) -- all eleven measure reward 0; the reference solution measures reward 1 on both held-out portfolios with margins of 1.37% and 2.33% (roughly 6-11x the Monte Carlo estimation noise at the grading path count), not a knife-edge pass.
"""

