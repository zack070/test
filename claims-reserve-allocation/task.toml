relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving budget-constrained resource allocation, risk-adjusted decision-making, and reconciliation of outcomes against a stated policy under real operational constraints. This gives me a working sense of what a genuine claims/reserving operation actually has to weigh (settlement discounts, correlated exposure, tail risk versus expected cost) and what a realistic versus contrived version of that tradeoff looks like. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance, which is directly relevant to judging whether this task's grading (a sealed Monte Carlo re-simulation of the agent's own submitted policy, with a pass bar calibrated against measured baseline performance) is a fair and meaningful test of the underlying skill rather than an arbitrary one. I am not an actuary or an operations-research specialist by training; the technical implementation (the generative model and its parameters, the scenario-based MILP reference solution, the calibration of the pass bar against measured baseline objectives across multiple independently-generated instances, and the two-stage sealed verifier) was built with AI assistance under my direction, with my own judgment applied to whether the model, the baselines, and the grading reflect a realistic claims-reserving tradeoff and a realistic test of solving it well.
"""

