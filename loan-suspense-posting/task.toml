name = "afterquery/loan-suspense-posting"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
Loan servicing operations teams run a nightly posting job over their active portfolio that decides, for every incoming payment, exactly how much goes to fees, escrow, interest, and principal, and whether an underpayment should post at all -- getting this wrong is a real, audited compliance failure (misapplied payments, wrongful delinquency reporting, and incorrect interest accrual are recurring servicing-audit findings), not a cosmetic bug. This task reproduces that job over a synthetic but fully disclosed 80-loan, 75-day portfolio (synthetic data, disclosed as such) built around a specific, fully-stated mechanism: an underpayment is held in a per-loan suspense balance rather than partially applied, and is only released -- in full, through the fees/escrow-shortage/interest/principal waterfall -- on the day accumulated cash first covers one complete contractual installment (including any escrow shortage created by a scheduled disbursement that must be evaluated before that day's release test). Interest keeps accruing on the undiminished principal balance the entire time a payment sits in suspense, and delinquency is driven by whether a full installment has actually posted, not by whether cash arrived. This was checked directly, not assumed: the single most plausible non-expert implementation of the fully-disclosed spec -- apply every payment immediately through the waterfall, whatever its size, and advance the due date once a running per-cycle credit counter reaches the installment amount, which is what a competent engineer writes if they do not model "hold until a full installment is covered" -- was built and measured against the real sealed verifier. It gets 53 of 80 loans (66%) wrong, with aggregate dollar errors in the thousands across principal, interest, and suspense balances. A second, independent near-miss that implements the correct suspense mechanism exactly but keys payments by the borrower-stated effective date instead of the servicer's posting date (the specific trap the spec names and forbids) still gets 39 of 80 loans (49%) wrong even with every other rule correct, because the two dates diverge by 1-3 days on most payments and that shift silently moves interest, release timing, and delinquency status. A day-3 error compounds silently through day 40 with no single visibly-wrong day to point at, so the agent has to sustain correct sequencing across the whole window, not just get one day's rule-reading right; roughly 15 of the 80 loans additionally hit a forced case where a scheduled escrow disbursement and a suspense release land in the same posting window, which only a correctly-ordered implementation resolves.
"""

solution_explanation = """
The reference solution (solution/poster.py) is a direct day-by-day state-machine simulation, not a search or optimization: for each of the 75 days, for every loan, it (1) accrues actual/365 per-diem interest on the principal balance carried in from the prior day, (2) applies any scheduled escrow disbursement for that day, (3) evaluates the release test -- suspense balance plus today's cash against fees owed + escrow shortage + the fixed contractual installment -- releasing the entire pooled amount through the fees-then-escrow-shortage-then-interest-then-principal waterfall only if it clears that threshold, otherwise holding the full amount in suspense untouched, and (4) assesses at most one late fee per due-date cycle once the loan crosses the 15-day grace period. The correctness bar here is exactness, not cleverness: the reference implementation was cross-checked against a second, independently-written implementation (different code structure -- loan-major loop instead of day-major, independently re-derived arithmetic rather than shared logic) on the worked example, the visible practice portfolio, and the sealed grading portfolio, with zero field mismatches across all three; the worked example's numbers were additionally verified by hand against the spec. The sealed reference answer used for grading was frozen from the second, independent implementation, never from the code the reference solution shares a lineage with.
"""

verification_explanation = """
The agent's deliverable is /app/outputs/poster.py -- a single Python file, run once against the sealed held-out portfolio as a fresh subprocess under an unprivileged runner user with a firm timeout (the same one-shot-batch isolation pattern as this account's other batch tasks; there is no live decide()-per-event loop here, so no incrementally-revealed state and no frame-introspection surface to defend). What stays hidden is the sealed grading portfolio's precomputed reference ledger and per-payment allocation trace (tests/sealed/reference/), chown+chmod root-only before Stage 1 (untrusted) ever runs; the sealed INPUT portfolio and payment data are deliberately left readable, since the candidate's code legitimately needs them and the posting rules themselves are fully disclosed in SERVICING_SPEC.md on purpose. Stage 2 (trusted, root, executes no candidate code) compares the candidate's output against the frozen reference: every monetary field to the cent, dates and buckets exactly, and -- separately from the final ledger -- the complete per-payment allocation breakdown, so a submission cannot pass by getting the end state right while skipping how it got there. Eleven adversarial submissions were run against the real two-stage verifier (see cheat/README.md for each one's measured result): a reward-forgery attempt and a sealed-reference read attempt (both blocked by the root-owned chmod-700 sealing, verified directly to raise PermissionError under the runner UID), a crash, a malformed CLI, an infinite loop (verified against the real subprocess-timeout code path), a syntactically-valid empty submission, a memorized answer for the visible practice portfolio (fails because grading uses a different sealed seed with disjoint loan IDs), a submission that computes the exact correct ledger but silently omits every suspense-hold record from the payment-allocation breakdown (isolates that the breakdown check is load-bearing, not redundant with the ledger check), a submission that honors the borrower memo field as an instruction rather than the cosmetic field the spec declares it to be, and the two structural adversarial baselines described in difficulty_explanation (no-suspense immediate-waterfall, and effective-date-instead-of-posting-date). All eleven measure reward 0; the reference solution measures reward 1.
"""

