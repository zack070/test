[task]
name = "afterquery/withholding-tax"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
Tax and treasury operations analysts who maintain a cross-border withholding-tax rule engine spend most of their time not writing that engine from scratch but diagnosing why an existing one produces a wrong number on some payments: a report looks plausible end-to-end, a handful of line items are off, and the job is to localize which piece of the engine's logic diverges from policy and fix it. This task reproduces that situation using synthetic entities, ownership records, payments, and FX rates generated for this task (not real filings or real counterparties). The agent is handed a rule engine (pipeline/engine.py) that is supposed to implement RULEBOOK.md but contains three real, differently-flavored, independently-introduced bugs: an ownership-relevant-parent resolution memoized per entity instead of per (entity, payment date), so it silently reuses a stale look-through answer for a payee whose controlling owner changed between two payment dates; a cumulative annual-threshold comparison using >= instead of >, wrong only at the exact boundary; and a retroactive re-rate that applies the post-threshold rate going forward but never revisits payments already processed earlier in the same payee-year group, even though the rule requires correcting them too. None of the three raises an exception, and none is apparent from reading any single function in isolation -- each produces a wrong number only on specific payments whose facts happen to exercise it, so the failure has to be localized against real output before it can be diagnosed and fixed. This was measured directly against the real pipeline, not assumed: the unmodified engine gets 2 of the worked example's 9 payments wrong, 21 of the case dataset's 109 payments wrong (total off by 9.1%), and on the two sealed held-out datasets used for grading, 13 of 64 and 17 of 84 payments wrong. A submission that special-cases the payments visible in the worked example or case dataset rather than fixing the underlying logic fails held-out grading, which was checked directly with a "memorize the visible answers, guess for anything else" cheat attempt (see cheat/README.md).
"""

solution_explanation = """
The reference solution (solution/engine.py) is pipeline/engine.py with all three bugs fixed: the per-entity memoization cache is removed entirely (the ownership walk is resolved fresh for each payment's own date, which is all correctness requires -- the cache was never needed for anything but a premature optimization that introduced the bug), the threshold comparison changed from >= to >, and the retroactive re-rate changed from a single forward-only pass to computing each payee-year group's full total first and then applying the final rate to every payment in that group uniformly. This was cross-checked against dev/rule_engine.py, a second implementation derived independently rather than by patching the buggy version (recursive instead of the buggy version's caching structure, a single grouped total instead of a running-total-with-a-crossed-flag), plus a THIRD, differently-coded implementation (dev/rule_engine2.py, iterative with a precomputed ownership timeline) built during the original rule-design phase specifically to catch a bug shared between "the reference" and "the ground truth." All three agree exactly, to the cent, on every payment across the worked example, the case dataset, and both sealed held-out datasets used for grading -- zero discrepancies. Five boundary conventions beyond the three headline bugs (exactly-50% ownership, holding period at exactly the threshold day count, a cumulative total landing exactly on the annual threshold, which calendar month's FX rate applies, and rounding order) were separately checked via ablation: for each, the best-fit answer under the most plausible alternate reading was computed against real data, and four of five diverge by a clear, measured margin ($6.8k-$90k); the fifth (rounding order) was found to be genuinely immaterial at this rulebook's scale rather than forced to matter, and is stated precisely in the rulebook for completeness rather than left as a source of graded difficulty.
"""

verification_explanation = """
The agent's deliverable is /app/outputs/engine.py -- their fixed copy of the given pipeline -- so candidate code genuinely executes at grading time, once per sealed held-out dataset. This is a one-shot batch computation, not a live decide()-per-event loop like the companion field-service-dispatch and cash-sweep bundles: there is no incrementally-revealed state to leak, so a plain subprocess invocation (`python3 /app/outputs/engine.py <sealed_data_dir> <output_path>`, run as the unprivileged `runner` user, a genuinely separate OS process with a firm per-dataset timeout) is sufficient isolation -- no multiprocessing IPC, no frame-introspection surface, because there is no separate trusted process running a live simulation for the candidate's code to peek into. What the candidate's code legitimately needs is the SEALED INPUT data (it has to read it to compute anything, same as it read the visible case/ dataset during its own turn); what must stay hidden is only the ground truth those inputs are graded against, which is chown+chmod sealed before Stage 1 (the pattern proven on the companion field-service-dispatch bundle, applied here from the start rather than discovered late) and never touched by anything Stage 1 does. Stage 2 (trusted, root, runs no candidate code) independently re-checks Stage 1's collected output against the sealed ground truth from scratch -- five fields per payment (both rates, both withholding amounts, the true-up) plus the total, with tight absolute tolerance (0.02 USD/line, 1e-6 on rates, 0.05 USD on the total) to absorb legitimate floating-point differences without forgiving a wrong rule application; every tested wrong strategy misses by orders of magnitude more than this tolerance. Nine adversarial submissions were tested against the real verifier (see cheat/README.md for each one's measured result): resubmitting the unmodified buggy pipeline unchanged, three standard patterns (reward forgery via direct write to reward.txt, a crashing run(), an infinite loop testing the timeout), a malformed submission missing the required interface, two naive constant-rate strategies, and a "memorize the visible dataset's answers, fall back to a naive guess for anything unrecognized" attempt that fails because held-out payment_ids happen to share the same numbering scheme but not the same underlying facts -- all measure reward 0; the reference solution measures reward 1 on both held-out datasets.
"""

category = "Operations"
subcategory = "Compliance"
tags = ["tax", "compliance", "treasury", "debugging", "rule-engine"]
expert_time_estimate_hours = 6
relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving regulatory compliance, financial reconciliation, and rule-governed decision-making under real operational constraints -- applying structured, rule-based reasoning to determine correct outcomes and assessing whether a given computation or classification correctly reflects a stated policy. This gives me a working sense of what a genuine treasury/tax-compliance operation actually has to get right (treaty eligibility, ownership look-through, threshold-triggered reclassification) and what a realistic versus contrived version of that complexity looks like, including what kind of implementation mistake a competent-but-imperfect engineer plausibly makes versus an arbitrary or unrealistic one. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance, which is directly relevant to judging whether this task's grading (exact/tolerance-based comparison of a computed report, produced by the agent's own fixed pipeline running against sealed data, cross-checked by three independently-built implementations) is a fair and meaningful test rather than an arbitrary one. I am not a tax attorney or a compliance engineer by training; the technical implementation (the rule engine and its independent cross-checks, the deliberately-planted pipeline bugs and the reasoning for why each is realistic rather than arbitrary, the ablation checks proving the rulebook's boundary conventions are unambiguous, and the two-stage verifier) was built with AI assistance under my direction, with my own judgment applied to whether the rules, the bugs, and the grading reflect a realistic cross-border withholding-tax operation and a realistic debugging task.
"""

