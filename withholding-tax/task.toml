relevant_experience = """
I work as an operations and business data analyst (2024-present), where I have directly reviewed business scenarios involving regulatory compliance, financial reconciliation, and rule-governed decision-making under real operational constraints -- applying structured, rule-based reasoning to determine correct outcomes and assessing whether a given computation or classification correctly reflects a stated policy. This gives me a working sense of what a genuine treasury/tax-compliance operation actually has to get right (treaty eligibility, ownership look-through, threshold-triggered reclassification) and what a realistic versus contrived version of that complexity looks like, including what kind of implementation mistake a competent-but-imperfect engineer plausibly makes versus an arbitrary or unrealistic one. I also evaluate AI-generated business outputs against predefined criteria and have supported AI training/evaluation projects involving business reasoning and quality assurance, which is directly relevant to judging whether this task's grading (exact/tolerance-based comparison of a computed report, produced by the agent's own fixed pipeline running against sealed data, cross-checked by three independently-built implementations) is a fair and meaningful test rather than an arbitrary one. I am not a tax attorney or a compliance engineer by training; the technical implementation (the rule engine and its independent cross-checks, the deliberately-planted pipeline bugs and the reasoning for why each is realistic rather than arbitrary, the ablation checks proving the rulebook's boundary conventions are unambiguous, and the two-stage verifier) was built with AI assistance under my direction, with my own judgment applied to whether the rules, the bugs, and the grading reflect a realistic cross-border withholding-tax operation and a realistic debugging task.
"""

