[task]
name = "afterquery/withholding-tax"

[metadata]
author_name = "Tonny Muthoka"
author_email = "tonnysammy952@gmail.com"

difficulty_explanation = """
This is a resubmission after quality review rejected the first version on two blocking criteria. One (typos: wrong entity IDs in the worked example, a stale repo-relative path, a stale payment count) was hygiene and is fixed. The other (difficulty) was structural, not a wording problem: the first version handed the agent a fully-specified rulebook plus a worked example that walked through every rule, so the entire task reduced to "read the spec carefully, implement it" -- correct behavior for a well-specified task, but not difficult, since a rulebook this precise removes any need for the kind of investigative reasoning the review correctly flagged as missing. Patching that version's rules further would not have fixed a genre problem, so the task is rebuilt around a different kind of work entirely: instead of writing a computation from a complete spec, the agent is handed a pipeline (pipeline/engine.py) that is SUPPOSED to implement the same rulebook but doesn't -- it has three real, individually-subtle, differently-flavored bugs, each the kind of mistake a competent engineer plausibly makes rather than an arbitrary one: an ownership-relevant-parent resolution that's cached per entity instead of per (entity, payment date), so it silently gives the same answer to two payments for the same payee even when the payee's ownership genuinely changed between them; a cumulative-threshold check using >= instead of > (wrong only at the exact boundary, which is rare and easy to miss in casual testing); and a retroactive re-rate that only applies going forward from the payment that crosses the threshold, forgetting the rule requires fixing already-processed earlier payments too. None of the three throws an exception or is visible from reading the code in isolation -- each has to be reproduced (the agent must run the pipeline, compare its output against a worked example's shown correct answers, and notice which specific payments disagree and why) before it can be diagnosed and fixed, which is exactly the "symptom and cause separated, must reproduce before fixing" shape the authoring guide identifies as genuine difficulty, as opposed to the "read-and-solve" shape the rejected version had. This was measured directly: the unmodified given pipeline gets 2 of the worked example's 9 payments wrong, 21 of the case dataset's 109 payments wrong (total off by 9.1%), and on the two sealed held-out datasets used for grading, 13 of 64 and 17 of 84 payments wrong -- so a submission that doesn't genuinely fix the underlying logic (as opposed to special-casing the specific payments visible in the worked example or case dataset) fails held-out grading, which was checked directly via a "memorized visible answers, falls back to a naive guess for anything else" cheat attempt (see cheat/README.md).
"""

solution_explanation = """
The reference solution (solution/engine.py) is pipeline/engine.py with all three bugs fixed: the per-entity memoization cache is removed entirely (the ownership walk is resolved fresh for each payment's own date, which is all correctness requires -- the cache was never needed for anything but a premature optimization that introduced the bug), the threshold comparison changed from >= to >, and the retroactive re-rate changed from a single forward-only pass to computing each payee-year group's full total first and then applying the final rate to every payment in that group uniformly. This was cross-checked against dev/rule_engine.py, a second implementation derived independently rather than by patching the buggy version (recursive instead of the buggy version's caching structure, a single grouped total instead of a running-total-with-a-crossed-flag), plus a THIRD, differently-coded implementation (dev/rule_engine2.py, iterative with a precomputed ownership timeline) built during the original rule-design phase specifically to catch a bug shared between "the reference" and "the ground truth." All three agree exactly, to the cent, on every payment across the worked example, the case dataset, and both sealed held-out datasets used for grading -- zero discrepancies. Five boundary conventions beyond the three headline bugs (exactly-50% ownership, holding period at exactly the threshold day count, a cumulative total landing exactly on the annual threshold, which calendar month's FX rate applies, and rounding order) were separately checked via ablation: for each, the best-fit answer under the most plausible alternate reading was computed against real data, and four of five diverge by a clear, measured margin ($6.8k-$90k); the fifth (rounding order) was found to be genuinely immaterial at this rulebook's scale rather than forced to matter, and is stated precisely in the rulebook for completeness rather than left as a source of graded difficulty.
"""

verification_explanation = """
The agent's deliverable is /app/outputs/engine.py -- their fixed copy of the given pipeline -- so, unlike the first (rejected) version of this task, candidate code genuinely executes at grading time, once per sealed held-out dataset. This is a one-shot batch computation, not a live decide()-per-event loop like the companion field-service-dispatch and cash-sweep bundles: there is no incrementally-revealed state to leak, so a plain subprocess invocation (`python3 /app/outputs/engine.py <sealed_data_dir> <output_path>`, run as the unprivileged `runner` user, a genuinely separate OS process with a firm per-dataset timeout) is sufficient isolation -- no multiprocessing IPC, no frame-introspection surface, because there is no separate trusted process running a live simulation for the candidate's code to peek into. What the candidate's code legitimately needs is the SEALED INPUT data (it has to read it to compute anything, same as it read the visible case/ dataset during its own turn); what must stay hidden is only the ground truth those inputs are graded against, which is chown+chmod sealed before Stage 1 (the pattern proven on the companion field-service-dispatch bundle, applied here from the start rather than discovered late) and never touched by anything Stage 1 does. Stage 2 (trusted, root, runs no candidate code) independently re-checks Stage 1's collected output against the sealed ground truth from scratch -- five fields per payment (both rates, both withholding amounts, the true-up) plus the total, with tight absolute tolerance (0.02 USD/line, 1e-6 on rates, 0.05 USD on the total) to absorb legitimate floating-point differences without forgiving a wrong rule application; every tested wrong strategy misses by orders of magnitude more than this tolerance. Nine adversarial submissions were tested against the real verifier (see cheat/README.md for each one's measured result): resubmitting the unmodified buggy pipeline unchanged, three standard patterns (reward forgery via direct write to reward.txt, a crashing run(), an infinite loop testing the timeout), a malformed submission missing the required interface, two naive constant-rate strategies, and a "memorize the visible dataset's answers, fall back to a naive guess for anything unrecognized" attempt that fails because held-out payment_ids happen to share the same numbering scheme but not the same underlying facts -- all measure reward 0; the reference solution measures reward 1 on both held-out datasets.
"""

